name: Atualizador Automatizado de Notícias

on:
  schedule:
    - cron: '0 * * * *' # Dispara de 1 em 1 hora automaticamente
  workflow_dispatch: # Permite execução manual pelo botão

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Sistema
      run: |
        pip install requests lxml mtranslate twilio

    - name: Executar Monitor de Notícias
      run: python monitor.py

    - name: Publicar Alterações no GitHub Pages
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git commit -m "Notícias updated" || exit 0
        git push

    - name: Enviar Notificação no WhatsApp
      env:
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        SEU_NUMERO_WHATSAPP: ${{ secrets.SEU_NUMERO_WHATSAPP }}
      run: |
        python -c "
        import os
        from twilio.rest import Client
        
        try:
            client = Client(os.environ['TWILIO_ACCOUNT_SID'], os.environ['TWILIO_AUTH_TOKEN'])
            
            # Limpa o número de qualquer caractere extra
            num = os.environ['SEU_NUMERO_WHATSAPP'].replace('+', '').replace(' ', '').strip()
            
            # Teste 1: Formato original salvo nos Secrets
            msg1 = client.messages.create(
                from_='whatsapp:+14155238886',
                body='[Teste 1] O script rodou com o formato salvo!',
                to=f'whatsapp:+{num}'
            )
            print(f'Tentativa 1 enviada. SID: {msg1.sid}')
            
            # Teste 2: Se o número tem 13 dígitos (Ex: 5511999999999), tenta remover o 9 da frente
            if len(num) == 13:
                num_sem_9 = num[:4] + num[5:]
                msg2 = client.messages.create(
                    from_='whatsapp:+14155238886',
                    body='[Teste 2] O script rodou removendo o nono dígito!',
                    to=f'whatsapp:+{num_sem_9}'
                )
                print(f'Tentativa 2 enviada (sem 9). SID: {msg2.sid}')
                
        except Exception as e:
            print(f'Erro ao enviar: {e}')
            exit(1)
        "
