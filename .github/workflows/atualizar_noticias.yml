name: Atualizador Automatizado de Notícias

on:
  schedule:
    - cron: '0 * * * *' # Dispara de 1 em 1 hora automaticamente
  workflow_dispatch: # Permite execução manual pelo botão

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Sistema
      run: |
        pip install requests lxml mtranslate twilio

    - name: Executar Monitor de Notícias
      run: python monitor.py

    - name: Publicar Alterações no GitHub Pages
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        # O bloco abaixo baixa as novidades do servidor antes de tentar enviar (corrige o erro de reject)
        git fetch origin main
        git pull --rebase origin main
        git commit -m "Notícias updated" || exit 0
        git push origin main

    - name: Enviar Resumo no WhatsApp
      env:
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        SEU_NUMERO_WHATSAPP: ${{ secrets.SEU_NUMERO_WHATSAPP }}
      run: |
        python -c "
        import os
        from twilio.rest import Client
        
        try:
            with open('resumo.txt', 'r', encoding='utf-8') as f:
                conteudo = f.read().strip()
                
            client = Client(os.environ['TWILIO_ACCOUNT_SID'], os.environ['TWILIO_AUTH_TOKEN'])
            num = os.environ['SEU_NUMERO_WHATSAPP'].replace('+', '').replace(' ', '').strip()
            
            message = client.messages.create(
                from_='whatsapp:+14155238886',
                body=conteudo,
                to=f'whatsapp:+{num}'
            )
            print(f'Sucesso! SID: {message.sid}')
        except Exception as e:
            print(f'Erro: {e}')
            exit(1)
        "
