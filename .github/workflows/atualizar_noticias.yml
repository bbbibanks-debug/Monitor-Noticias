name: Atualizador Automatizado de Notícias

on:
  schedule:
    - cron: '0 * * * *' # CONFIGURADO: Dispara a raspagem de 1 em 1 hora automaticamente
  workflow_dispatch: # Permite que você clique em um botão para atualizar na hora que quiser

# Permissão necessária para o GitHub Actions conseguir fazer o 'git push' das atualizações
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Sistema
      run: |
        pip install requests lxml mtranslate

    - name: Executar Monitor de Notícias
      run: python monitor.py

    - name: Publicar Alterações no GitHub Pages
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git commit -m "Notícias atualizadas automaticamente" || exit 0
        git push
