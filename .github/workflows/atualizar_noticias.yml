name: Atualizador Automatizado de Notícias

on:
  schedule:
    - cron: '5 * * * *' # Dispara no minuto 5 de cada hora para evitar congestionamentos
  workflow_dispatch: # Permite execução manual pelo botão

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Baixa o histórico necessário para evitar falhas de push

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Sistema
      run: |
        pip install requests lxml mtranslate twilio

    - name: Executar Monitor de Notícias
      run: python monitor.py

    - name: Publicar Alterações no GitHub
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add index.html
        git add resumo.txt || true 
        if git diff --staged --quiet; then
          echo "Nenhuma alteração detectada."
        else
          git commit -m "Notícias atualizadas [skip ci]"
          git pull --rebase origin main
          git push origin main
        fi

    - name: Enviar Resumo no WhatsApp
      env:
        TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        SEU_NUMERO_WHATSAPP: ${{ secrets.SEU_NUMERO_WHATSAPP }}
      run: |
        python -c "
        import os
        from twilio.rest import Client
        
        try:
            if not os.path.exists('resumo.txt'):
                print('Arquivo resumo.txt não encontrado.')
                exit(0)
                
            with open('resumo.txt', 'r', encoding='utf-8') as f:
                conteudo = f.read().strip()
                
            if not conteudo:
                print('Resumo vazio. Envio cancelado.')
                exit(0)
                
            client = Client(os.environ['TWILIO_ACCOUNT_SID'], os.environ['TWILIO_AUTH_TOKEN'])
            num = os.environ['SEU_NUMERO_WHATSAPP'].replace('+', '').replace(' ', '').strip()
            
            message = client.messages.create(
                from_='whatsapp:+14155238886',
                body=conteudo,
                to=f'whatsapp:+{num}'
            )
            print(f'Sucesso! SID: {message.sid}')
        except Exception as e:
            print(f'Erro: {e}')
            exit(1)
        "
