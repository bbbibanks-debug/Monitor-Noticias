name: Atualizador Automatizado de Notícias

on:
  schedule:
    - cron: '0 * * * *' # Dispara a raspagem de 1 em 1 hora automaticamente
  workflow_dispatch: # Permite execução manual pelo botão

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código do Repositório
      uses: actions/checkout@v4

    - name: Configurar Ambiente Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar Dependências do Sistema
      run: |
        pip install requests lxml mtranslate

    - name: Executar Monitor de Notícias
      run: python monitor.py

    - name: Publicar Alterações no GitHub Pages
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add index.html
        git commit -m "Notícias updated" || exit 0
        git push

    - name: Enviar Notificação no WhatsApp
      uses: kaviadigdarshan/whatsapp-actions@main
      env:
        ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
        AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
        TO_WHATSAPP_NUMBER: ${{ secrets.SEU_NUMERO_WHATSAPP }}
