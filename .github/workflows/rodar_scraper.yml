name: Atualizador Automatico de Noticias

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

# Ativa globalmente o Node24 para remover todos os warnings do painel
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Copiar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar bibliotecas externas
      run: |
        python -m pip install --upgrade pip
        pip install requests lxml mtranslate

    - name: Executar o script de raspagem
      run: python monitor.py

    - name: Salvar e subir alteracoes com segurança
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Recarga automatica de noticias (Bot)"
        file_pattern: 'index.html'
